<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Clipboard</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.3rem; }
    input, textarea, button { font: inherit; padding: 10px; box-sizing: border-box; }
    input, textarea { width: 100%; border: 1px solid #c4c7c5; border-radius: 10px; }
    input:focus, textarea:focus { outline: 2px solid #1a73e8; outline-offset: 0; border-color: transparent; }
    textarea { height: 40vh; margin: 8px 0; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
    button {
      background: #1a73e8; color: #fff; border: 0; border-radius: 10px;
      font-weight: 600; cursor: pointer; transition: background 0.15s;
    }
    button:hover { background: #1765cc; }
    button:active { background: #1558b0; }
    button:focus-visible { outline: 3px solid #8ab4f8; outline-offset: 2px; }
    #status { min-height: 1.4em; margin-top: 8px; font-size: 0.9rem; }
    .note { margin-top: 16px; font-size: 0.8rem; opacity: 0.65; }
  </style>
</head>
<body>
  <h1>Online Clipboard</h1>
  <input id="name" placeholder="Clipboard name (e.g. mynotes)" autocapitalize="off" autocomplete="off" spellcheck="false">
  <textarea id="text" placeholder="Paste text here"></textarea>
  <div class="row">
    <button id="save">Save</button>
    <button id="load">Load</button>
    <button id="copy">Copy</button>
  </div>
  <div id="status"></div>
  <p class="note">Saved text is deleted automatically 3 days after it was last saved. Anyone who knows the name can read it, so don't store secrets.</p>

  <script>
    const $ = (id) => document.getElementById(id);
    const nameEl = $('name'), textEl = $('text'), statusEl = $('status');

    nameEl.value = localStorage.getItem('clipName') || '';

    const setStatus = (msg) => (statusEl.textContent = msg);
    const url = () => `/api/clips/${encodeURIComponent(nameEl.value.trim())}`;

    function requireName() {
      if (nameEl.value.trim()) return true;
      setStatus('Enter a name first.');
      return false;
    }

    async function call(method, body) {
      const res = await fetch(url(), {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      return data;
    }

    const expiryNote = (d) => `Expires ${new Date(d.expiresAt).toLocaleString()}.`;

    $('save').onclick = async () => {
      if (!requireName()) return;
      try {
        const d = await call('PUT', { text: textEl.value });
        localStorage.setItem('clipName', nameEl.value.trim());
        setStatus(`Saved. ${expiryNote(d)}`);
      } catch (e) { setStatus(e.message); }
    };

    $('load').onclick = async () => {
      if (!requireName()) return;
      try {
        const d = await call('GET');
        textEl.value = d.text;
        localStorage.setItem('clipName', nameEl.value.trim());
        setStatus(`Loaded. ${expiryNote(d)}`);
      } catch (e) { setStatus(e.message); }
    };

    $('copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(textEl.value);
        setStatus('Copied to your device clipboard.');
      } catch {
        textEl.select();
        setStatus('Select and copy manually (browser blocked auto-copy).');
      }
    };
  </script>
</body>
</html>
