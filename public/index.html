<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Clipboard</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6fb;
      --card: #ffffff;
      --card2: #eef1f8;
      --text: #1b1f2a;
      --muted: #6b7386;
      --line: #dfe3ee;
      --accent: #1a73e8;
      --accent2: #7c4dff;
      --grad: linear-gradient(135deg, var(--accent), var(--accent2));
      --shadow: 0 6px 24px rgba(30, 40, 90, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1220;
        --card: #181c2f;
        --card2: #20253b;
        --text: #eceffa;
        --muted: #98a1bb;
        --line: #2a3050;
        --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      min-height: 100dvh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(600px 300px at 90% -5%, rgba(124, 77, 255, 0.18), transparent 70%),
        radial-gradient(500px 300px at -10% 0%, rgba(26, 115, 232, 0.16), transparent 70%);
    }
    #app {
      max-width: 560px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px);
    }
    .card {
      padding: 22px 20px;
      border-radius: 26px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    h1 { margin: 0 0 18px; font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    h1 .em { font-size: 1.4rem; }
    .field { display: block; margin-bottom: 14px; }
    .field > span { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    input, textarea, button { font: inherit; color: inherit; }
    input, textarea {
      width: 100%; padding: 0 14px;
      border-radius: 14px; border: 1px solid var(--line); background: var(--bg);
      font-size: 16px; outline: none;
    }
    input { height: 48px; }
    textarea { height: 40vh; padding: 12px 14px; resize: vertical; }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.25); }
    .btns { display: flex; gap: 10px; margin-top: 4px; }
    button {
      flex: 1; min-height: 48px; padding: 0 14px; border-radius: 14px;
      background: var(--card2); border: 0; cursor: pointer;
      font-weight: 700; transition: transform 0.12s, opacity 0.2s;
    }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.6; cursor: default; }
    button.primary { background: var(--grad); color: #fff; }
    button:focus-visible { outline: 3px solid rgba(26, 115, 232, 0.55); outline-offset: 2px; }
    #status { min-height: 1.4em; margin-top: 14px; font-size: 0.9rem; color: var(--muted); }
    .note { margin: 16px 0 0; font-size: 0.78rem; line-height: 1.5; color: var(--muted); }
  </style>
</head>
<body>
  <div id="app">
    <div class="card">
      <h1><span class="em">📋</span> Online Clipboard</h1>
      <label class="field">
        <span>Clipboard name</span>
        <input id="name" placeholder="e.g. mynotes" autocapitalize="off" autocomplete="off" spellcheck="false">
      </label>
      <label class="field">
        <span>Text</span>
        <textarea id="text" placeholder="Paste text here"></textarea>
      </label>
      <div class="btns">
        <button id="save" class="primary">Save</button>
        <button id="load">Load</button>
        <button id="copy">Copy</button>
      </div>
      <div id="status"></div>
      <p class="note">Saved text is deleted automatically 3 days after it was last saved. Anyone who knows the name can read it, so don't store secrets.</p>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const nameEl = $('name'), textEl = $('text'), statusEl = $('status');

    nameEl.value = localStorage.getItem('clipName') || '';

    const setStatus = (msg) => (statusEl.textContent = msg);
    const url = () => `/api/clips/${encodeURIComponent(nameEl.value.trim())}`;

    function requireName() {
      if (nameEl.value.trim()) return true;
      setStatus('Enter a name first.');
      return false;
    }

    async function call(method, body) {
      const res = await fetch(url(), {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      return data;
    }

    const expiryNote = (d) => `Expires ${new Date(d.expiresAt).toLocaleString()}.`;

    $('save').onclick = async () => {
      if (!requireName()) return;
      try {
        const d = await call('PUT', { text: textEl.value });
        localStorage.setItem('clipName', nameEl.value.trim());
        setStatus(`Saved. ${expiryNote(d)}`);
      } catch (e) { setStatus(e.message); }
    };

    $('load').onclick = async () => {
      if (!requireName()) return;
      try {
        const d = await call('GET');
        textEl.value = d.text;
        localStorage.setItem('clipName', nameEl.value.trim());
        setStatus(`Loaded. ${expiryNote(d)}`);
      } catch (e) { setStatus(e.message); }
    };

    $('copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(textEl.value);
        setStatus('Copied to your device clipboard.');
      } catch {
        textEl.select();
        setStatus('Select and copy manually (browser blocked auto-copy).');
      }
    };
  </script>
</body>
</html>
